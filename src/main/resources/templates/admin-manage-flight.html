<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Admin Manage Flights</title>
<link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
</head>
<body>

<div th:replace="~{common/admin-header.html:: header}"></div>


<div class="quick-actions-flight">
    <a th:href="@{/admin/manage/flight?mode=add}" class="btn-primary">Add New Flight</a>
    <a th:href="@{/admin/manage/flight?mode=view}" class="btn-primary">View Flights</a>
    <a th:href="@{/admin/manage/flight?mode=delete}" class="btn-primary">Delete Flights</a>
</div>

<div th:if="${message}" class="message-box">
    <p th:text="${message}"></p>
</div>


<div th:if="${mode == 'add'}">
    <h2>Add Flight</h2>
    <form th:action="@{/admin/manage/flight/add}" th:object="${flight}" method="post">
        <label>Source:</label>
        <input type="text" th:field="*{source}" required><br>

        <label>Destination:</label>
        <input type="text" th:field="*{destination}" required><br>

        <label>Departure Date:</label>
        <input type="date" th:field="*{departureDate}" required><br>

        <label>Arrival Date:</label>
        <input type="date" th:field="*{arrivalDate}" required><br>

        <label>Departure Time:</label>
        <input type="time" th:field="*{departure_time}" required><br>

        <label>Arrival Time:</label>
        <input type="time" th:field="*{arrival_time}" required><br>

        <button type="submit">Add Flight</button>
    </form>
</div>

<div th:if="${mode == 'view'}">
    <h2>View Flights</h2>
    <table class="flight-table">
        <tr>
            <th>Flight ID</th>
            <th>Source</th>
            <th>Destination</th>
            <th>Departure Date</th>
            <th>Arrival Date</th>
            <th>Departure Time</th>
            <th>Arrival Time</th>
        </tr>
        <tr th:each="flight, iterStat : ${flights}" th:if="${iterStat.index} < 5">
            <td th:text="${flight.id}"></td>
            <td th:text="${flight.source}"></td>
            <td th:text="${flight.destination}"></td>
            <td th:text="${flight.departureDate}"></td>
            <td th:text="${flight.arrivalDate}"></td>
            <td th:text="${flight.departure_time}"></td>
            <td th:text="${flight.arrival_time}"></td>
        </tr>
    </table>
</div>


<div th:if="${mode == 'delete'}">
    <h2>Delete Flight</h2>
    <table class="flight-table">
        <tr>
            <th>Flight ID</th>
            <th>Source</th>
            <th>Destination</th>
            <th>Action</th>
        </tr>
        <tr th:each="flight, iterStat : ${flights}" th:if="${iterStat.index} < 5">
            <td th:text="${flight.id}"></td>
            <td th:text="${flight.source}"></td>
            <td th:text="${flight.destination}"></td>
            <td>
                <form th:action="@{/admin/manage/flight/delete}" method="post">
                    <input type="hidden" name="flightId" th:value="${flight.id}">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
