<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Flight search page</title>
<link rel="stylesheet"  type= "text/css" th:href="@{/css/user.css}">
 <link rel="stylesheet" th:href="@{/css/flightsearch.css}">
</head>
<body>
<div th:replace="~{common/header.html:: header}"></div>
<div class="flight-table-container">
 <h2>Available Flights</h2>
 <div th:if="${#lists.isEmpty(flights)}">
 <p> NO flights found for the selected criteria.</p>
 </div>
 <table class="flight-table" th:if="${!#lists.isEmpty(flights)}">
 <thead><tr>
 <th>Flight Number</th>
 <th>Source</th>
 <th>Destination</th>
<th>Departure Date</th>
<th>Arrival Date</th></tr></thead>
<tbody>
<tr th:each="flight : ${flights}" style="cursor:pointer;" >
<td th:text="${flight.id}"></td>
<td th:text="${flight.source}"></td>
<td th:text="${flight.destination}"></td>
<td th:text="${flight.departureDate}"></td>
<td th:text="${flight.arrivalDate}"></td>
<td>
    <a th:href="@{/api/flights/selectFlight(flightId=${flight.id})}" class="btn-primary">Book</a>
</td>


</tr>
</th:block>
</tbody>
</table>
</div>

</body>

</html>
